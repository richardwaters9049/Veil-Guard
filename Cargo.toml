[package]
name = "veilguard"
version = "0.1.0-dev.6"
edition = "2024"
rust-version = "1.98"
description = "Offline staged-Git credential review CLI"
license = "MIT"
publish = false

[dependencies]
aho-corasick = "1.1"
clap = { version = "4.5", features = ["derive"] }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
regex = "1.11"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"

[profile.release]
strip = true
