name: Acceptance checks

on:
  push:
    branches: [main, "phase-one/**", "phase-two/**", "phase-three/**", "phase-four/**", "phase-five/**", "phase-six/**", "phase-seven/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned research environment manager
        run: 'python -m pip install --only-binary=:all: uv==0.13.7'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Run acceptance checks
        run: python scripts/check_all.py
      - name: Instrument runtime network and process boundaries
        run: python scripts/check_runtime.py --output "$RUNNER_TEMP/veilguard-runtime-check"
      - name: Verify native development package and fresh-prefix install
        run: python scripts/check_packaging.py --output "$RUNNER_TEMP/veilguard-package-check"
